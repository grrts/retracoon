name: Android

# Builds a debug APK on every manual run, and a signed release bundle (.aab) for Google
# Play when the signing secrets exist. Pushing a tag like v1.2.0 also uploads the bundle
# to the Play internal testing track when PLAY_SERVICE_ACCOUNT_JSON is set.
# Secrets and setup: docs/PUBLISHING.md.

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
        env:
          # Scoreboard server, set under Settings > Secrets and variables > Actions > Variables.
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          VITE_GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      - run: npx cap sync android
      - name: Debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: retracoon-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - name: Signed release bundle
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: retracoon-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
      - name: Upload to Play (internal testing)
        if: ${{ github.ref_type == 'tag' && hashFiles('android/app/build/outputs/bundle/release/*.aab') != '' && env.HAS_PLAY == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.retracoon.game
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
