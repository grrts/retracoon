name: Deploy server

# Runs server/ (API, website, wiki) on any Linux server with Docker: the image serves
# HTTPS itself (FrankenPHP/Caddy, certificate from Let's Encrypt) next to PostgreSQL and
# the prize job, see server/deploy/compose.yaml. The image is built here on GitHub, so
# the server never compiles anything. The game's browser build goes in it too, served at
# /play/ and talking to the API on the same address (docs/ONLINE.md "Connecting the game").
# - Pull requests touching server/ or the game: builds the image and checks it answers /api/health.
# - Run by hand, or on pushes to main touching server/ once AUTO_DEPLOY is "true":
#   uploads the image over SSH and restarts (server/deploy/up.sh). Docker is installed
#   the first time. Without DEPLOY_HOST it does nothing.
# Secrets and variables: docs/ONLINE.md "Deploying with GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', 'src/**', 'index.html', 'package-lock.json', 'vite.config.ts', '.github/workflows/deploy-server.yml']
  pull_request:
    paths: ['server/**', 'src/**', 'index.html', 'package-lock.json', 'vite.config.ts', '.github/workflows/deploy-server.yml']

jobs:
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the game for /play/
        run: npm ci && npx vite build --outDir server/public/play --emptyOutDir
        env:
          VITE_API_URL: same-origin
      - run: docker build -t retracoon-server server
      - name: Start the stack
        run: |
          mkdir -p "$RUNNER_TEMP/srv"
          cp server/deploy/compose.yaml "$RUNNER_TEMP/srv/"
          printf 'APP_SECRET=%s\nPOSTGRES_PASSWORD=ci\nDOMAIN=:80\nDEFAULT_URI=http://localhost\n' "$(openssl rand -hex 16)" > "$RUNNER_TEMP/srv/.env"
          bash server/deploy/up.sh "$RUNNER_TEMP/srv"
      - name: Health check
        run: |
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors http://localhost/api/health
          curl -fsS -o /dev/null http://localhost/
          curl -fsS -o /dev/null http://localhost/wiki
          curl -fsS http://localhost/play/ | grep -q '<script'
      - if: failure()
        working-directory: ${{ runner.temp }}/srv
        run: docker compose logs

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && vars.AUTO_DEPLOY == 'true')
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    concurrency:
      group: deploy-server
      cancel-in-progress: false
    env:
      HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - if: env.HAS_HOST != 'true'
        run: echo "DEPLOY_HOST isn't set, nothing to do."
      - if: env.HAS_HOST == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_HOST == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build the game for /play/
        if: env.HAS_HOST == 'true'
        run: npm ci && npx vite build --outDir server/public/play --emptyOutDir
        env:
          VITE_API_URL: same-origin
      - name: Build image
        if: env.HAS_HOST == 'true'
        run: |
          docker build -t retracoon-server server
          docker save retracoon-server | gzip > "$RUNNER_TEMP/image.tar.gz"
      - name: SSH setup
        if: env.HAS_HOST == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER || 'root' }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS isn't set; trusting the host key the server offers now."
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host deploy\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' \
            "$HOST" "$PORT" "$USER_NAME" > ~/.ssh/config
      - name: Upload and restart
        if: env.HAS_HOST == 'true'
        env:
          ROOT: ${{ vars.DEPLOY_PATH || '/opt/retracoon' }}
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
        run: |
          ssh deploy "mkdir -p '$ROOT' && cat > '$ROOT/image.tar.gz'" < "$RUNNER_TEMP/image.tar.gz"
          ssh deploy "cat > '$ROOT/compose.yaml'" < server/deploy/compose.yaml
          if [ -n "$SERVER_ENV" ]; then
            printf '%s\n' "$SERVER_ENV" | ssh deploy "umask 077 && cat > '$ROOT/.env'"
          fi
          ssh deploy "cat > '$ROOT/up.sh'" < server/deploy/up.sh
          ssh deploy "bash '$ROOT/up.sh' '$ROOT'"
      - name: Health check
        if: env.HAS_HOST == 'true' && vars.API_URL != ''
        run: |
          curl -fsS --retry 20 --retry-delay 3 --retry-all-errors "${{ vars.API_URL }}/api/health"
          curl -fsS -o /dev/null "${{ vars.API_URL }}/play/"
