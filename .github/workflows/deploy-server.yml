name: Deploy server

# Ships server/ (API, website, wiki) to the server over SSH: tests it, installs the
# production dependencies here, uploads a new release and switches to it with
# server/deploy/release.sh. Runs when started by hand, and on pushes to main that touch
# server/ once the AUTO_DEPLOY variable is "true". Without DEPLOY_HOST it does nothing.
# Secrets, variables and server setup: docs/ONLINE.md "Deploying with GitHub Actions".

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
    steps:
      - if: env.HAS_HOST != 'true'
        run: echo "DEPLOY_HOST isn't set, nothing to do."
      - if: env.HAS_HOST == 'true'
        uses: actions/checkout@v4
      - if: env.HAS_HOST == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pdo_sqlite, intl
      - name: Tests
        if: env.HAS_HOST == 'true'
        working-directory: server
        run: |
          composer install --no-interaction --no-progress
          php bin/phpunit
      - name: Build release
        if: env.HAS_HOST == 'true'
        working-directory: server
        run: |
          rm -rf vendor var
          composer install --no-dev --no-scripts --no-interaction --no-progress
          # Writes vendor/autoload_runtime.php too, which --no-scripts skips.
          composer dump-autoload --no-dev --classmap-authoritative
          tar -czf "$RUNNER_TEMP/release.tgz" --exclude=./tests --exclude=./.env.local --exclude='./.env.*.local' --exclude=./phpunit.dist.xml --exclude='./compose*.yaml' .
      - name: SSH setup
        if: env.HAS_HOST == 'true'
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS isn't set; trusting the host key the server offers now."
            ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
          fi
          printf 'Host deploy\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  StrictHostKeyChecking yes\n' \
            "$HOST" "$PORT" "${{ secrets.DEPLOY_USER }}" > ~/.ssh/config
      - name: Upload and switch
        if: env.HAS_HOST == 'true'
        env:
          ROOT: ${{ vars.DEPLOY_PATH }}
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          RELOAD_CMD: ${{ vars.DEPLOY_RELOAD }}
        run: |
          : "${ROOT:?Set the DEPLOY_PATH variable, e.g. /var/www/retracoon}"
          NAME="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          ssh deploy "mkdir -p '$ROOT/releases/$NAME' '$ROOT/shared' && tar -xzf - -C '$ROOT/releases/$NAME'" < "$RUNNER_TEMP/release.tgz"
          if [ -n "$SERVER_ENV" ]; then
            printf '%s\n' "$SERVER_ENV" | ssh deploy "umask 077 && cat > '$ROOT/shared/.env.local'"
          fi
          ssh deploy "RELOAD_CMD=$(printf '%q' "$RELOAD_CMD") bash '$ROOT/releases/$NAME/deploy/release.sh' '$ROOT' '$NAME'"
      - name: Health check
        if: env.HAS_HOST == 'true' && vars.API_URL != ''
        run: curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "${{ vars.API_URL }}/api/health"
