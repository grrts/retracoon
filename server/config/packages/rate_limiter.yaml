framework:
    rate_limiter:
        # new players per IP address
        register:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # finished runs per player
        run:
            policy: token_bucket
            limit: 30
            rate: { interval: '1 minute', amount: 10 }
            cache_pool: cache.rate_limiter
        # tracking batches per IP address (a phone sends one every minute or so while playing)
        events:
            policy: token_bucket
            limit: 60
            rate: { interval: '1 minute', amount: 20 }
            cache_pool: cache.rate_limiter
        # shared runs per player (each one stores a card image)
        share:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # friend-code attempts per player
        friend:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # mailing list sign-ups per IP address
        signup:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
            cache_pool: cache.rate_limiter
        # counted site visits and store clicks per IP address (more are served, not counted)
        site:
            policy: sliding_window
            limit: 30
            interval: '1 hour'
            cache_pool: cache.rate_limiter
    cache:
        pools:
            cache.rate_limiter:
                adapter: cache.app

