# Controllers declare their routes with #[Route]. Everything answers in JSON,
# errors included (as application/problem+json), except the wiki's web pages.
controllers:
    resource:
        path: ../src/Controller/
        namespace: App\Controller
    type: attribute
    exclude: ../src/Controller/WikiController.php
    defaults:
        _format: json

wiki:
    resource: App\Controller\WikiController
    type: attribute
